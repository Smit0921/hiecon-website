{% extends 'base.html' %}
{% block title %}Complete Payment{% endblock %}

{% block content %}
<div class="container mt-5">
    <h2>Checkout Payment</h2>
    <p>Total Amount: <strong>₹ {{ amount_rupees }}</strong></p>
    <button id="rzp-button" class="btn btn-primary">Complete Payment</button>
</div>

<form id="payment-success-form" action="{% url 'payment_callback' %}" method="POST" style="display: none;">
    {% csrf_token %}
    <input type="hidden" name="razorpay_order_id" id="razorpay_order_id">
    <input type="hidden" name="razorpay_payment_id" id="razorpay_payment_id">
    <input type="hidden" name="razorpay_signature" id="razorpay_signature">
</form>

<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script>
    const options = {
        key: "{{ razorpay_key_id }}",
        amount: "{{ amount_paise }}",
        currency: "INR",
        name: "Hiecon",
        description: "Cart Payment",
        order_id: "{{ order_id }}",
        handler: function (response) {
            document.getElementById('razorpay_order_id').value = response.razorpay_order_id;
            document.getElementById('razorpay_payment_id').value = response.razorpay_payment_id;
            document.getElementById('razorpay_signature').value = response.razorpay_signature;
            document.getElementById('payment-success-form').submit();
        },
        theme: {
            color: "#198754"
        }
    };

    const rzp = new Razorpay(options);
    document.getElementById('rzp-button').onclick = function(e){
        rzp.open();
        e.preventDefault();
    }
</script>
{% endblock %}
